[workspace]
members = ["nf-core", "kernel", "tools/nfdisk", "nf-app", "tools/nfpack", "programs/calculadora", "programs/plantilla"]
default-members = ["nf-core"]
resolver = "2"

[workspace.package]
version = "0.7.2"
edition = "2021"

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = 2
lto = true
codegen-units = 1
