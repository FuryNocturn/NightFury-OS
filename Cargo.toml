[workspace]
members = ["nf-core", "kernel", "tools/nfdisk", "nf-app", "nf-web","tools/nfpack", "programs/calculadora", "programs/plantilla", "programs/reloj", "programs/paint", "programs/bloc-notas", "programs/terminal", "programs/configuracion", "programs/explorador", "programs/mensajes", "programs/navegador", "tools/nfprog"]
default-members = ["nf-core"]
resolver = "2"

[workspace.package]
version = "0.12.5"
edition = "2021"
license = "GPL-3.0-only"
authors = ["Tare Fernandez Salas (FuryNocturn)"]
repository = "https://github.com/FuryNocturn/NightFury-OS"

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = 2
lto = true
codegen-units = 1
