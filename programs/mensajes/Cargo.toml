[package]
name = "mensajes"
version = "1.0.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "NightFury: Mensajes, chat cifrado de extremo a extremo entre equipos de la red local"

# La lógica va en la biblioteca para poder probarla y sacarle capturas en el PC (tools/nfprog).
[lib]
name = "mensajes_app"

[[bin]]
name = "mensajes"
path = "src/main.rs"
test = false

[dependencies]
nf-core = { path = "../../nf-core" }
nf-app = { path = "../../nf-app" }
