[package]
name = "paint"
version = "1.0.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "NightFury: Paint, dibujo sencillo con herramientas básicas, como programa en modo usuario"

# La lógica va en la biblioteca para poder probarla y sacarle capturas en el PC (tools/nfprog).
[lib]
name = "paint_app"

[[bin]]
name = "paint"
path = "src/main.rs"
test = false

[dependencies]
nf-core = { path = "../../nf-core" }
nf-app = { path = "../../nf-app" }
